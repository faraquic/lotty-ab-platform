x-app-environment: &app-environment
  CONFIG_NAME: config.example.json
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-local-only}
  BOOTSTRAP_PASSWORD_HASH: ${BOOTSTRAP_PASSWORD_HASH:-}
  POSTGRES_DSN: "postgres://${POSTGRES_USER:-lotty}:${POSTGRES_PASSWORD:-lottypassword}@postgres:5432/${POSTGRES_DB:-labp}?sslmode=disable"
  REDIS_ADDRESS: redis:6379
  S3_BUCKET: ${S3_BUCKET:-labp}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  PANEL_HTTP_ADDRESS: 0.0.0.0:8081
  RUNTIME_HTTP_ADDRESS: 0.0.0.0:8082
  ANALYTICS_HTTP_ADDRESS: 0.0.0.0:8083

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: labp-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: labp
      POSTGRES_USER: lotty
      POSTGRES_PASSWORD: lottypassword
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - lotty-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotty -d labp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: labp-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - lotty-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: quay.io/minio/minio:latest
    container_name: labp-s3
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - lotty-s3data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "2",
          "http://127.0.0.1:9000/minio/health/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  panel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: panel
        PORT: 8081
        VERSION: ${SERVICE_VERSION:-dev}
    ports:
      - "127.0.0.1:${PANEL_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment: *app-environment
    volumes:
      - "${CONFIG_FILE:-./config.example.json}:/labp/config.example.json:ro"
    restart: unless-stopped

  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: runtime
        PORT: 8082
        VERSION: ${SERVICE_VERSION:-dev}
    ports:
      - "127.0.0.1:${RUNTIME_PORT:-8082}:8082"
    depends_on:
      panel:
        condition: service_started
    environment: *app-environment
    volumes:
      - "${CONFIG_FILE:-./config.example.json}:/labp/config.example.json:ro"
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: analytics
        PORT: 8083
        VERSION: ${SERVICE_VERSION:-dev}
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8083}:8083"
    depends_on:
      panel:
        condition: service_started
    environment: *app-environment
    volumes:
      - "${CONFIG_FILE:-./config.example.json}:/labp/config.example.json:ro"
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - panel
      - runtime
      - analytics
    restart: unless-stopped

volumes:
  lotty-pgdata:
  lotty-redisdata:
  lotty-s3data:
