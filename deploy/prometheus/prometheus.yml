global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: panel
    static_configs:
      - targets: ["localhost:8081"]
    metrics_path: /metrics

  - job_name: runtime
    static_configs:
      - targets: ["localhost:8082"]
    metrics_path: /metrics

  - job_name: analytics
    static_configs:
      - targets: ["localhost:8083"]
    metrics_path: /metrics

  - job_name: clickhouse
    static_configs:
      - targets: ["localhost:8123"]
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ["localhost:9092"]
    metrics_path: /metrics
