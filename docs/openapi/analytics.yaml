openapi: 3.0.3
info:
  title: Lotty AB Platform — Analytics API
  description: Event ingestion and attribution plane.
  version: dev

servers:
  - url: http://localhost:8083/api/v1/analytics
    description: local run (go run / bin/analytics direct, without nginx)
  - url: http://localhost:8080/api/v1/analytics
    description: docker run (via nginx reverse proxy, docker-compose up)

tags:
  - name: health
    description: Liveness probe

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns `OK` while the service process is running.
      operationId: health
      security: []
      responses:
        "200":
          description: Service process is alive
          content:
            text/plain:
              schema:
                type: string
                enum: [OK]
                example: "OK"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, PAYLOAD_TOO_LARGE, INTERNAL_SERVER_ERROR]
            message:
              type: string
          required: [code, message]
      required: [success, error]
