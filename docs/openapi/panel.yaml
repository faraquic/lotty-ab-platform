        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: "Key: 'CreateUserRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: user not found

    Conflict:
      description: Resource already exists (email or full_name taken)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: CONFLICT
              message: user already exists

    Forbidden:
      description: Action forbidden (e.g. self-delete, self-role-change, or last-admin protection)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: cannot delete your own account

    Unauthorized:
      description: Authentication required or token invalid/revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: missing or malformed token

    UnprocessableEntity:
      description: Semantic validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNPROCESSABLE_ENTITY
              message: invalid variants

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: internal server error

  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: root@labp.net
          format: email
        password:
          type: string
          example: root!@#$
          format: password
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              description: Signed JWT (HS256), subject is the user ID
            expires_at:
              type: string
              format: date-time
              description: Token expiration time
          required: [token, expires_at]
      required: [success, data]

    Role:
      type: string
      enum: [admin, experimenter, approver, viewer]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 primary key
        full_name:
          type: string
          minLength: 1
          maxLength: 256
          description: Unique human-readable name (indexed via UNIQUE constraint)
        email:
          type: string
          format: email
          description: Unique email address (indexed via UNIQUE constraint and idx_users_email)
        role:
          $ref: "#/components/schemas/Role"
        avatar_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, full_name, email, role, created_at, updated_at]

    CreateUserRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 256
          description: Must be unique across all users
        email:
          type: string
          format: email
          description: Must be unique across all users (case-sensitive)
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"
      required: [full_name, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
      minProperties: 1

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"
      required: [success, data]

    PaginationMeta:
      type: object
      required: [limit, offset, count, total, has_next]
      properties:
        limit:
          type: integer
          minimum: 1
          example: 20
        offset:
          type: integer
          minimum: 0
          example: 0
        count:
          type: integer
          minimum: 0
          example: 20
        total:
          type: integer
          format: int64
          minimum: 0
          example: 137
        has_next:
          type: boolean
          example: true

    UserListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                [
                  BAD_REQUEST,
                  UNAUTHORIZED,
                  NOT_FOUND,
                  PAYLOAD_TOO_LARGE,
                  CONFLICT,
                  FORBIDDEN,
                  UNPROCESSABLE_ENTITY,
                  SERVICE_UNAVAILABLE,
                  INTERNAL_SERVER_ERROR,
                ]
            message:
              type: string
          required: [code, message]
      required: [success, error]

    ComponentStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        criticality:
          type: string
          enum: [required, optional]
          description: Impact of this component on service readiness
        message:
          type: string
          description: Human-readable detail, present when status is not ok
      required: [status, criticality]

    ReadyResponse:
      type: object
      properties:
        service:
          type: string
          example: labp-panel
        version:
          type: string
          example: 0.1.0
        environment:
          type: string
          example: local
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentStatus"
          properties:
            service:
              $ref: "#/components/schemas/ComponentStatus"
            database:
              $ref: "#/components/schemas/ComponentStatus"
            cache:
              $ref: "#/components/schemas/ComponentStatus"
            snapshot:
              $ref: "#/components/schemas/ComponentStatus"
            storage:
              $ref: "#/components/schemas/ComponentStatus"
      required: [service, version, environment, timestamp, components]

    FlagType:
      type: string
      enum: [string, number, bool]

    Flag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 primary key
        key:
          type: string
          minLength: 3
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        type:
          $ref: "#/components/schemas/FlagType"
        default_value:
          description: JSON value matching the flag type (string, number, or boolean)
          oneOf:
            - type: string
            - type: number
            - type: boolean
        description:
          type: string
          maxLength: 4096
        created_by:
          $ref: "#/components/schemas/User"
          nullable: true
        updated_by:
          $ref: "#/components/schemas/User"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, key, name, type, default_value, created_at, updated_at]

    CreateFlagRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 3
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        type:
          $ref: "#/components/schemas/FlagType"
        default_value:
          description: JSON value matching the flag type
          oneOf:
            - type: string
            - type: number
            - type: boolean
        description:
          type: string
          minLength: 1
          maxLength: 4096
      required: [key, name, type, default_value]

    UpdateFlagRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 3
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        default_value:
          description: JSON value matching the flag type
          oneOf:
            - type: string
            - type: number
            - type: boolean
        description:
          type: string
          minLength: 1
          maxLength: 4096
      minProperties: 1

    FlagResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Flag"
      required: [success, data]

    FlagListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/FlagListItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    FlagListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          minLength: 3
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        type:
          $ref: "#/components/schemas/FlagType"
        default_value:
          description: JSON value matching the flag type (string, number, or boolean)
          oneOf:
            - type: string
            - type: number
            - type: boolean
        description:
          type: string
          maxLength: 4096
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, key, name, type, default_value, created_at, updated_at]

    MetricType:
      type: string
      enum: [count, sum, unique_count, ratio, percentile, average]

    MetricStatus:
      type: string
      enum: [active, archived]

    AttributionFallback:
      type: string
      enum: [none, subject]

    EventRef:
      type: object
      properties:
        event_type:
          type: string
          minLength: 1
          maxLength: 128
        field:
          type: string
          minLength: 1
          maxLength: 128
      required: [event_type]

    MetricAggregation:
      type: object
      description: >
        Transparent aggregation config. Shape depends on metric_type:
        count/unique_count require event_type only;
        sum/average require event_type + field;
        percentile requires event_type + field + level (0, 1);
        ratio requires numerator + denominator and no top-level event_type/field/level.
      properties:
        event_type:
          type: string
          minLength: 1
          maxLength: 128
        field:
          type: string
          minLength: 1
          maxLength: 128
        level:
          type: number
          exclusiveMinimum: false
          exclusiveMaximum: true
        numerator:
          $ref: "#/components/schemas/EventRef"
        denominator:
          $ref: "#/components/schemas/EventRef"

    MetricAttribution:
      type: object
      properties:
        require_exposure:
          type: boolean
        window_days:
          type: integer
