openapi: 3.0.3
info:
  title: Lotty AB Platform — Panel API
  description: Control plane API.
  version: dev

servers:
  - url: http://localhost:8081/api/v1/panel
    description: local run (go run / bin/panel direct, without nginx)
  - url: http://localhost:8080/api/v1/panel
    description: docker run (via nginx reverse proxy, docker-compose up)

# JWT bearer auth; endpoints marked public below are excluded
security:
  - bearerAuth: []

tags:
  - name: users
    description: User accounts and RBAC roles
  - name: auth
    description: Authentication
  - name: health
    description: Liveness and readiness probes
  - name: flags
    description: Feature flags
  - name: metrics
    description: Metrics configuration for A/B test analytics

paths:
  /login:
    post:
      tags: [auth]
      summary: Authenticate and issue a JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: invalid email or password
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: health
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: ready
      security: []
      responses:
        "200":
          description: Service is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /me:
    get:
      tags: [users]
      summary: Get the authenticated user's own profile
      operationId: getMe
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/avatar:
    post:
      tags: [users]
      summary: Upload or delete the authenticated user's avatar
      description: |
        Upload a new avatar by sending a file in the `avatar` field.
        Delete the avatar by sending an empty `avatar` field or omitting it entirely.
      operationId: uploadMyAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required: [avatar]
      responses:
        "200":
          description: Avatar uploaded or deleted, user profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /users:
    post:
      tags: [users]
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [users]
      summary: List users
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of users to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: string
          format: uuid

    get:
      tags: [users]
      summary: Get a user by ID
      operationId: getUser
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [users]
      summary: Partially update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [users]
      summary: Soft-delete a user
      operationId: deleteUser
      responses:
        "204":
          description: User deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}/avatar:
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: string
          format: uuid

    post:
      tags: [users]
      summary: Upload or delete a user's avatar (admin only)
      description: |
        Upload a new avatar by sending a file in the `avatar` field.
        Delete the avatar by sending an empty `avatar` field or omitting it entirely.
      operationId: uploadUserAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required: [avatar]
      responses:
        "200":
          description: Avatar uploaded or deleted, user profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /flags:
    post:
      tags: [flags]
      summary: Create a feature flag
      operationId: createFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlagRequest"
      responses:
        "200":
          description: Flag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [flags]
      summary: List feature flags
      operationId: listFlags
      parameters:
        - name: limit
          in: query
          description: Maximum number of flags to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of flags to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /flags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Flag ID
        schema:
          type: string
          format: uuid

    get:
      tags: [flags]
      summary: Get a flag by ID
      operationId: getFlag
      responses:
        "200":
          description: Flag found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [flags]
      summary: Partially update a flag
      operationId: updateFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlagRequest"
      responses:
        "200":
          description: Flag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [flags]
      summary: Soft-delete a flag
      operationId: deleteFlag
      responses:
        "204":
          description: Flag deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /metrics:
    post:
      tags: [metrics]
      summary: Create a metric
      operationId: createMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMetricRequest"
      responses:
        "200":
          description: Metric created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [metrics]
      summary: List metrics
      operationId: listMetrics
      parameters:
        - name: limit
          in: query
          description: Maximum number of metrics to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of metrics to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: archived
          in: query
          description: Include archived metrics in results
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /metrics/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Metric ID
        schema:
          type: string
          format: uuid

    get:
      tags: [metrics]
      summary: Get a metric by ID
      operationId: getMetric
      parameters:
        - name: archived
          in: query
          description: Include archived metrics
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Metric found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [metrics]
      summary: Partially update a metric
      description: |
        Updates mutable fields of a metric. The `metric_type` field is immutable after creation.
        Omitted fields remain unchanged. Aggregation must match the metric type; attribution requires window_days 1..30 and fallback (none, subject).
        To archive a metric, set `status` to `archived`.
      operationId: updateMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMetricRequest"
      responses:
        "200":
          description: Metric updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments:
    post:
      tags: [experiments]
      summary: Create an experiment
      description: Creates a draft experiment with version 1 (fresh assignment salt). Variants are optional at creation and can be set later while draft.
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentRequest"
      responses:
        "200":
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [experiments]
      summary: List experiments
      operationId: listExperiments
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExperimentStatus"
      responses:
        "200":
          description: List of experiments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    get:
      tags: [experiments]
      summary: Get an experiment by ID
      description: Returns the experiment with its current version and variants.
      operationId: getExperiment
      responses:
        "200":
          description: Experiment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [experiments]
      summary: Update a draft experiment
      description: Only name and description of a draft experiment can change. Requires the current version for optimistic locking.
      operationId: updateExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExperimentRequest"
      responses:
        "200":
          description: Experiment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    post:
      tags: [experiments]
      summary: Create a new experiment version
      description: Any distribution-affecting change creates a new version with a fresh assignment salt. Not allowed for running experiments. A new version after approval resets the experiment to draft.
      operationId: createExperimentVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentVersionRequest"
      responses:
        "200":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/variants:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    put:
      tags: [experiments]
      summary: Replace variants of the current version
      description: Only allowed while the experiment is draft. Requires at least 2 variants, exactly one control, and weights summing to the version allocation.
      operationId: setExperimentVariants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetExperimentVariantsRequest"
      responses:
        "200":
          description: Variants replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    post:
      tags: [experiments]
      summary: Submit a draft experiment for review
      description: Requires a complete current version (at least 2 variants, weights sum to allocation).
      operationId: submitExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentTransitionRequest"
      responses:
        "200":
          description: Experiment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    post:
      tags: [experiments]
      summary: Start an approved experiment
      description: Only one running or paused experiment may reference the same flag.
      operationId: startExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentTransitionRequest"
      responses:
        "200":
          description: Experiment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    post:
      tags: [experiments]
      summary: Pause a running experiment
      operationId: pauseExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentTransitionRequest"
      responses:
        "200":
          description: Experiment paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    post:
      tags: [experiments]
      summary: Resume a paused experiment
      description: A pause initiated by a guardrail requires an admin override to resume.
      operationId: resumeExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentTransitionRequest"
      responses:
        "200":
          description: Experiment resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    post:
      tags: [experiments]
      summary: Complete a running or paused experiment
      description: Requires a decision (rollout_winner, rollback, no_effect) and a reason. A rollout winner additionally requires the winning variant and updates the flag default.
      operationId: completeExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteExperimentRequest"
      responses:
        "200":
          description: Experiment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /experiments/{id}/rollout:
    parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
          format: uuid

    post:
      tags: [experiments]
      summary: Roll out the winning variant
      description: Discrete rollout action. Sets the flag default to the winner value and completes the experiment.
      operationId: rolloutExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolloutExperimentRequest"
      responses:
        "200":
          description: Winner rolled out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
