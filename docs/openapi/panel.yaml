openapi: 3.0.3
info:
  title: Lotty AB Platform — Panel API
  description: Control plane API for the panel service (users management and authentication).
  version: 0.2.0

servers:
  - url: http://localhost:8080/api/panel/v1
    description: local development

# JWT bearer auth; endpoints marked public below are excluded
security:
  - bearerAuth: []

tags:
  - name: users
    description: User accounts and RBAC roles
  - name: auth
    description: Authentication
  - name: health
    description: Liveness and readiness probes

paths:
  /login:
    post:
      tags: [auth]
      summary: Authenticate and issue a JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated, token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: invalid email or password
        '500':
          $ref: '#/components/responses/InternalError'

  /api/panel/v1/health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: health
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /api/panel/v1/ready:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: ready
      security: []
      responses:
        '200':
          description: Service is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /users:
    post:
      tags: [users]
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [users]
      summary: List users
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of users to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      tags: [users]
      summary: Get a user by ID
      operationId: getUser
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [users]
      summary: Partially update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [users]
      summary: Soft-delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: "Key: 'CreateUserRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: user not found

    Conflict:
      description: Resource already exists (username or email taken)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: user already exists

    Forbidden:
      description: Action forbidden (e.g. self-delete, self-role-change, or last-admin protection)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: cannot delete your own account

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: internal server error

  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        hash_password:
          type: string
          format: password
      required: [email, hash_password]

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              description: Signed JWT (HS256), subject is the user ID
            expires_at:
              type: string
              format: date-time
              description: Token expiration time
          required: [token, expires_at]
      required: [success, data]

    Role:
      type: string
      enum: [admin, experimenter, approver, viewer]

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, username, email, role, created_at, updated_at]

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: '#/components/schemas/Role'
      required: [username, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
      minProperties: 1

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'
      required: [success, data]

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required: [success, data]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, NOT_FOUND, PAYLOAD_TOO_LARGE, CONFLICT, FORBIDDEN, INTERNAL_SERVER_ERROR]
            message:
              type: string
          required: [code, message]
      required: [success, error]

    ComponentStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        message:
          type: string
          description: Human-readable detail, present when status is not ok
      required: [status]

    ReadyResponse:
      type: object
      properties:
        service:
          type: string
          example: panel
        version:
          type: string
          example: 0.1.0
        environment:
          type: string
          example: local
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
          properties:
            service:
              $ref: '#/components/schemas/ComponentStatus'
            database:
              $ref: '#/components/schemas/ComponentStatus'
            cache:
              $ref: '#/components/schemas/ComponentStatus'
      required: [service, version, environment, timestamp, components]
