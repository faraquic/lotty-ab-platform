name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  PNPM_VERSION: "12.4.2"

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Go unit tests
        run: go test ./pkg/... -short -count=1

      - name: Frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Full project checks
        run: make check

      - name: Start integration infrastructure
        run: make dev-up

      - name: Go end-to-end tests
        run: make test-e2e

      - name: Stop integration infrastructure
        if: always()
        run: make dev-down

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build deployment images
        run: docker compose build

  deploy-dev:
    name: Deploy to dev
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Install SSH key and host keys
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_KNOWN_HOSTS: ${{ secrets.DEV_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEV_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEV_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy and smoke test
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          DEV_APP_DIR: ${{ secrets.DEV_APP_DIR }}
        run: |
          test -n "$DEV_HOST"
          test -n "$DEV_USER"
          DEV_SSH_PORT="${DEV_SSH_PORT:-22}"
          case "$DEV_SSH_PORT" in (*[!0-9]*|'') echo "DEV_SSH_PORT must be numeric"; exit 1;; esac
          test -n "$DEV_APP_DIR"
          ssh -p "$DEV_SSH_PORT" "$DEV_USER@$DEV_HOST" "cd '$DEV_APP_DIR' && git fetch origin master && git reset --hard origin/master && CONFIG_FILE=config.dev.json CONFIG_NAME=config.dev.json make up"
          ssh -p "$DEV_SSH_PORT" "$DEV_USER@$DEV_HOST" "curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/health >/dev/null"
          ssh -p "$DEV_SSH_PORT" "$DEV_USER@$DEV_HOST" "curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/v1/panel/health >/dev/null"
